<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 56" width="320" height="112">
  <!-- Phase 26 painted side-view — Cybertruck angular pickup; no logos/badges; facing right -->

  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#f2f2f2"/>
      <stop offset="55%" stop-color="#c8c8c8"/>
      <stop offset="82%" stop-color="#8a8a8a"/>
      <stop offset="100%" stop-color="#5a5a5a"/>
